name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: npm run check

      - name: Check release version
        run: npm run check:release

      - name: Build release archive
        run: |
          mkdir -p release
          cp dist/koenig-consent.css release/
          cp dist/koenig-consent.js release/
          tar -czf "release/koenigtech-consent-kit-${GITHUB_REF_NAME}.tar.gz" dist docs examples README.md CHANGELOG.md LICENSE package.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/koenig-consent.css \
            release/koenig-consent.js \
            "release/koenigtech-consent-kit-${GITHUB_REF_NAME}.tar.gz" \
            --title "KoenigTech Consent Kit ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/koenig-tech/koenigtech-consent-kit@${GITHUB_REF_NAME}/dist/koenig-consent.css"
          curl -fsS "https://purge.jsdelivr.net/gh/koenig-tech/koenigtech-consent-kit@${GITHUB_REF_NAME}/dist/koenig-consent.js"
